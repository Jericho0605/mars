name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      - run: zip -r drivewise-production.zip web src data/vehicles.json data/coverage.json data/vehicle-media.json package.json README.md
      - uses: actions/upload-artifact@v4
        with:
          name: drivewise-production
          path: drivewise-production.zip
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DriveWise Production
          files: drivewise-production.zip
